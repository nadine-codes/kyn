<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kyn — Brand identity system</title>
<meta name="description" content="The kyn brand identity system — logo, type, color, and usage." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<!-- Warm up the PDF.js CDN + start fetching the library during parse -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
<link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin />
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; background: var(--surface-0); color: var(--ink-1); overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }

  /* ============= TOPBAR (matches landing) ============= */
  .lp-top {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in oklch, var(--surface-0) 86%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--surface-line);
  }
  .lp-top-inner { max-width: 1320px; margin: 0 auto; padding: 14px var(--s-8); display: flex; align-items: center; justify-content: space-between; gap: var(--s-6); }
  .lp-mark { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-1); }
  .lp-mark .glyph {
    width: 26px; height: 26px; background: var(--orange-500); border-radius: 7px;
    position: relative; box-shadow: var(--bevel), 0 1px 0 rgba(0,0,0,0.4); display: inline-block;
  }
  .lp-mark .glyph::after {
    content: ""; position: absolute; inset: 6px; border: 2px solid #fff; border-radius: 3px;
    border-right-color: transparent; border-bottom-color: transparent; transform: rotate(45deg);
  }
  .lp-mark .word { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .lp-mark .reg { font-family: var(--font-mono); font-size: 9px; color: var(--ink-3); margin-left: 2px; letter-spacing: 0.1em; text-transform: uppercase; vertical-align: super; }
  .lp-nav { display: flex; gap: var(--s-6); align-items: center; }
  .lp-nav a { font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--ink-3); transition: color var(--dur-2); }
  .lp-nav a:hover, .lp-nav a[aria-current="page"] { color: var(--ink-1); }

  .btn-cta-ghost {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--surface-2); color: var(--ink-1); border: 1px solid var(--surface-line);
    border-radius: var(--r-pill); padding: 9px 16px;
    font-family: var(--font-body); font-size: 13px; font-weight: 500;
    box-shadow: var(--bevel); cursor: pointer; transition: background var(--dur-2);
  }
  .btn-cta-ghost:hover { background: var(--surface-3); }
  .arrow { width: 14px; height: 14px; }

  /* ============= PAGE HEAD ============= */
  .brand-head { max-width: 1320px; margin: 0 auto; padding: var(--s-10) var(--s-8) var(--s-6); }
  .brand-eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: var(--s-4); }
  .brand-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange-500); box-shadow: 0 0 12px var(--orange-glow); }
  .brand-eyebrow span.t { font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--ink-3); }
  .brand-head h1 { font-family: var(--font-display); font-size: clamp(36px, 5vw, 64px); line-height: 0.96; letter-spacing: -0.035em; font-weight: 500; margin: 0; }
  .brand-head p { color: var(--ink-3); font-size: 16px; max-width: 56ch; margin: var(--s-4) 0 0; line-height: 1.55; }

  /* ============= PDF VIEWER (PDF.js) ============= */
  .brand-doc { max-width: 1320px; margin: 0 auto var(--s-10); padding: 0 var(--s-8); flex: 1; width: 100%; box-sizing: border-box; display: flex; }
  .brand-viewer {
    flex: 1; width: 100%; height: min(82vh, 1000px);
    display: flex; gap: 0;
    border: 1px solid var(--surface-line); border-radius: var(--r-lg, 14px);
    background: var(--surface-1); box-shadow: var(--bevel);
    overflow: hidden;
  }
  /* Left thumbnail rail */
  .thumb-rail {
    flex: 0 0 148px; width: 148px; overflow-y: auto; overflow-x: hidden;
    background: var(--surface-1); border-right: 1px solid var(--surface-line);
    padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-3);
    scrollbar-width: thin;
  }
  .thumb {
    appearance: none; background: var(--surface-2); border: 1px solid var(--surface-line);
    border-radius: 8px; padding: 6px; cursor: pointer; position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    transition: border-color var(--dur-2), background var(--dur-2);
  }
  .thumb:hover { border-color: var(--ink-4); background: var(--surface-3); }
  .thumb.is-active { border-color: var(--orange-500); box-shadow: 0 0 0 1px var(--orange-500); }
  .thumb canvas { width: 100%; height: auto; display: block; border-radius: 3px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.35); }
  .thumb .num { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-3); }
  .thumb.is-active .num { color: var(--orange-500); }
  /* Main page stack */
  .page-stack {
    flex: 1; overflow-y: auto; padding: var(--s-6); background: var(--surface-2);
    display: flex; flex-direction: column; align-items: center; gap: var(--s-6);
    scrollbar-width: thin;
  }
  .page-stack .page { width: 100%; max-width: 920px; display: flex; justify-content: center; }
  .page-stack canvas { max-width: 100%; height: auto; display: block; border-radius: 4px; background: #fff; box-shadow: 0 6px 24px -10px rgba(0,0,0,0.55); }
  .viewer-status { margin: auto; color: var(--ink-3); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; }
  .brand-fallback { padding: var(--s-8); text-align: center; color: var(--ink-3); font-size: 14px; }

  /* ============= FOOTER ============= */
  .lp-foot { padding: var(--s-12) 0 var(--s-10); border-top: 1px solid var(--surface-line); }
  .lp-foot-inner { max-width: 1320px; margin: 0 auto; padding: 0 var(--s-8); display: flex; align-items: center; justify-content: space-between; gap: var(--s-8); flex-wrap: wrap; }
  .lp-foot-mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--tracking-mono); color: var(--ink-3); }
  .lp-foot-nav { display: flex; gap: var(--s-6); align-items: center; }
  .lp-foot-nav a { font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--ink-3); transition: color var(--dur-2); }
  .lp-foot-nav a:hover { color: var(--orange-500); }

  @media (max-width: 720px) {
    .lp-nav { display: none; }
    .brand-doc { padding: 0 var(--s-4); }
    .brand-viewer { flex-direction: column; height: 80vh; }
    .thumb-rail {
      flex: 0 0 auto; width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden;
      border-right: 0; border-bottom: 1px solid var(--surface-line);
    }
    .thumb { flex: 0 0 84px; width: 84px; }
  }
</style>
</head>
<body>

<!-- ===================== TOPBAR ===================== -->
<header class="lp-top" data-screen-label="Brand">
  <div class="lp-top-inner">
    <a class="lp-mark" href="/"><span class="glyph"></span><span class="word">kyn<span class="reg">®</span></span></a>
    <nav class="lp-nav">
      <a href="/#capabilities">Capabilities</a>
      <a href="/run">Demo</a>
      <a href="/design-system">Design system</a>
      <a href="/brand" aria-current="page">Brand</a>
    </nav>
  </div>
</header>

<!-- ===================== PAGE HEAD ===================== -->
<section class="brand-head">
  <div class="brand-eyebrow">
    <span class="dot"></span>
    <span class="t">KYN · BRAND IDENTITY SYSTEM</span>
  </div>
  <h1>Brand identity system</h1>
  <p>Scroll the complete 10-page kyn brand identity system below.</p>
</section>

<!-- ===================== PDF VIEWER ===================== -->
<section class="brand-doc">
  <div class="brand-viewer">
    <aside class="thumb-rail" id="thumbRail" aria-label="Page thumbnails"></aside>
    <div class="page-stack" id="pageStack">
      <div class="viewer-status" id="viewerStatus">Loading brand system…</div>
    </div>
  </div>
</section>

<!-- ===================== FOOTER ===================== -->
<footer class="lp-foot">
  <div class="lp-foot-inner">
    <a class="lp-mark" href="/"><span class="glyph"></span><span class="word">kyn<span class="reg">®</span></span></a>
    <nav class="lp-foot-nav">
      <a href="/">Home</a>
      <a href="/run">Demo</a>
      <a href="/design-system">Design system</a>
      <a href="/brand">Brand</a>
    </nav>
    <span class="lp-foot-mono">© 2026 KYN LABS</span>
  </div>
</footer>

<!-- ===================== PDF.js VIEWER SCRIPT ===================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  var PDF_URL = '/kyn-brand-system.pdf';
  var stack  = document.getElementById('pageStack');
  var rail   = document.getElementById('thumbRail');
  var status = document.getElementById('viewerStatus');

  function fail() {
    if (rail) rail.style.display = 'none';
    stack.innerHTML =
      '<div class="brand-fallback">Couldn\'t load the inline viewer. ' +
      '<a href="' + PDF_URL + '" style="color: var(--orange-500);">Open the brand system PDF</a>.</div>';
  }

  if (!window.pdfjsLib) { fail(); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var THUMB_W = 112;
  var ric = window.requestIdleCallback || function (cb) { return setTimeout(function () { cb(); }, 200); };

  // disableAutoFetch + range requests => only the bytes needed for the pages
  // being rendered are fetched, so page 1 appears without waiting for all 7 MB.
  pdfjsLib.getDocument({ url: PDF_URL, disableAutoFetch: true, disableStream: false })
    .promise.then(function (pdf) {

    function mainTargetWidth() {
      var avail = stack.clientWidth - 48; // ~ padding allowance
      return Math.max(280, Math.min(920, avail));
    }
    var mainW = mainTargetWidth();
    var entries = [];

    // Grab every page's dimensions up front (cheap dict reads, not image data)
    // so we can lay out correctly-sized placeholders and the thumbnail rail
    // immediately — before any heavy rendering happens.
    var gets = [];
    for (var i = 1; i <= pdf.numPages; i++) gets.push(pdf.getPage(i));

    Promise.all(gets).then(function (pages) {
      pages.forEach(function (page, idx) {
        var num = idx + 1;
        var base = page.getViewport({ scale: 1 });
        var ratio = base.height / base.width;

        // --- main page placeholder (blank, correctly sized) ---
        var wrap = document.createElement('div');
        wrap.className = 'page';
        wrap.dataset.page = num;
        var canvas = document.createElement('canvas');
        canvas.style.width = mainW + 'px';
        canvas.style.height = Math.round(mainW * ratio) + 'px';
        wrap.appendChild(canvas);
        stack.appendChild(wrap);

        // --- thumbnail placeholder ---
        var thumb = document.createElement('button');
        thumb.className = 'thumb';
        thumb.type = 'button';
        thumb.setAttribute('aria-label', 'Go to page ' + num);
        var tcanvas = document.createElement('canvas');
        tcanvas.width = Math.round(THUMB_W * dpr);
        tcanvas.height = Math.round(THUMB_W * ratio * dpr);
        tcanvas.style.width = THUMB_W + 'px';
        var tnum = document.createElement('span');
        tnum.className = 'num';
        tnum.textContent = num;
        thumb.appendChild(tcanvas);
        thumb.appendChild(tnum);
        rail.appendChild(thumb);

        var entry = { num: num, page: page, base: base, ratio: ratio,
                      wrap: wrap, canvas: canvas, tcanvas: tcanvas,
                      done: false, task: null };
        entries.push(entry);

        thumb.addEventListener('click', function () {
          var delta = wrap.getBoundingClientRect().top - stack.getBoundingClientRect().top;
          stack.scrollBy({ top: delta - 16, behavior: 'smooth' });
          renderMain(entry);
        });
      });

      // Render one main page (fetches only that page's bytes) and derive its
      // thumbnail by downscaling the result — no extra fetch for thumbnails.
      function renderMain(entry) {
        if (entry.done) return Promise.resolve();
        if (entry.task) return entry.task;
        var vp = entry.page.getViewport({ scale: (mainW / entry.base.width) * dpr });
        entry.canvas.width = vp.width;
        entry.canvas.height = vp.height;
        entry.task = entry.page.render({
          canvasContext: entry.canvas.getContext('2d'), viewport: vp
        }).promise.then(function () {
          entry.done = true; entry.task = null;
          entry.tcanvas.getContext('2d').drawImage(
            entry.canvas, 0, 0, entry.tcanvas.width, entry.tcanvas.height);
        });
        return entry.task;
      }

      // Highlight whichever page is in view.
      var active = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          var idx = parseInt(e.target.dataset.page, 10) - 1;
          entries.forEach(function (en, j) { en.thumb.classList.toggle('is-active', j === idx); });
        });
      }, { root: stack, threshold: 0.5 });

      // Render pages just before they scroll into view.
      var lazy = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (e.isIntersecting) renderMain(entries[parseInt(e.target.dataset.page, 10) - 1]);
        });
      }, { root: stack, rootMargin: '600px 0px' });

      entries.forEach(function (en) { active.observe(en.wrap); lazy.observe(en.wrap); });
      entries[0].thumb.classList.add('is-active');

      // Page 1 first — show it as soon as it paints.
      renderMain(entries[0]).then(function () { if (status) status.remove(); });

      // Quietly fill the remaining pages/thumbnails in the background at idle,
      // so scrolling is instant and every thumbnail eventually renders.
      var bg = 1;
      (function fillNext() {
        while (bg < entries.length && entries[bg].done) bg++;
        if (bg >= entries.length) return;
        renderMain(entries[bg]).then(function () { ric(fillNext); });
      })();
    });
  }).catch(fail);
})();
</script>

</body>
</html>
